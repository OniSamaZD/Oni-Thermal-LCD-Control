[project]
name = "thermalright-lcd"
version = "0.1.0"
description = "Windows control application for supported Thermalright USB LCD displays"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

[project.scripts]
thermalright-lcd = "thermalright_lcd.cli:main"
oni-thermal-lcd = "thermalright_lcd.gui:main"

[project.optional-dependencies]
gui = ["PySide6>=6.8", "Pillow>=10", "opencv-python>=4.9", "psutil>=5.9", "av>=18.1", "numpy>=2.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
